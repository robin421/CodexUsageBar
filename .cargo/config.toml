# Cargo configuration for tokeusage
#
# When developing on non-APFS volumes (such as exFAT on macOS), the operating system
# automatically generates AppleDouble (._*) files for extended attributes.
# This causes tauri-build to panic when parsing autogenerated permission TOMLs.
# Setting target-dir to /tmp/tauri-build-target avoids exFAT lock/linking limitations
# and prevents build panics.

[build]
target-dir = "/tmp/tauri-build-target"

[profile.dev]
incremental = true

[profile.test]
incremental = true
