name: CodexUsageBar
options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  ENABLE_HARDENED_RUNTIME: YES

targets:
  CodexUsageBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.codex.usagebar
      INFOPLIST_KEY_LSUIElement: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Codex Usage Bar"
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleIconFile: AppIcon
      CODE_SIGN_STYLE: Automatic
      ENABLE_USER_SCRIPT_SANDBOXING: NO

  CodexUsageBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CodexUsageBar
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.codex.usagebar.tests
      GENERATE_INFOPLIST_FILE: YES
